{% extends "base.html" %}
{% block title %}Login — SharePlate{% endblock %}
{% block content %}
<div class="login-3d-page">

  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>
  <div class="grid-bg"></div>

  <div class="floating-food fd1">🍱</div>
  <div class="floating-food fd2">🥗</div>
  <div class="floating-food fd3">🍛</div>
  <div class="floating-food fd4">🥙</div>

  <div class="login-3d-card">
    <div class="card-top-line"></div>

    <div class="login-3d-header">
      <div class="login-3d-icon">🍱</div>
      <h1>Welcome back</h1>
      <p>Login to share or claim food</p>
    </div>

    <a href="{{ url_for('google_login') }}" class="google-3d-btn">
      <svg width="18" height="18" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </a>

    <div class="divider-3d"><span>or</span></div>

    <form method="POST" class="auth-form">
      <div class="form-group-3d">
        <label>EMAIL</label>
        <input type="email" name="email" placeholder="you@example.com" required />
      </div>
      <div class="form-group-3d">
        <label>PASSWORD</label>
        <input type="password" name="password" placeholder="••••••••" required />
      </div>
      <button type="submit" class="login-3d-btn">Login →</button>
    </form>

    <p class="auth-switch-3d"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
    <p class="auth-switch-3d">New to SharePlate? <a href="{{ url_for('register') }}">Create account</a></p>

    <div class="card-bottom-line"></div>
  </div>
</div>

<style>
.login-3d-page {
  min-height: 90vh;
  background: #0a0a0a;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  position: relative;
  overflow: hidden;
}
.glow {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  pointer-events: none;
}
.glow-1 { width:500px; height:500px; background:radial-gradient(circle, rgba(45,106,79,0.35) 0%, transparent 70%); top:-150px; left:-150px; }
.glow-2 { width:400px; height:400px; background:radial-gradient(circle, rgba(82,183,136,0.2) 0%, transparent 70%); bottom:-100px; right:-100px; }
.glow-3 { width:300px; height:300px; background:radial-gradient(circle, rgba(244,162,97,0.15) 0%, transparent 70%); top:40%; right:5%; }
.grid-bg {
  position: absolute; top:0; left:0; right:0; bottom:0;
  background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 30px 30px;
}
.floating-food {
  position: absolute;
  font-size: 2.2rem;
  filter: drop-shadow(0 10px 20px rgba(45,106,79,0.5));
  pointer-events: none;
}
.fd1 { top:10%; left:5%; animation: fd1 4s ease-in-out infinite; }
.fd2 { top:15%; right:8%; animation: fd2 5s ease-in-out infinite; font-size:1.8rem; }
.fd3 { bottom:15%; left:8%; animation: fd3 3.5s ease-in-out infinite; }
.fd4 { bottom:20%; right:6%; animation: fd1 4.5s ease-in-out infinite; font-size:1.6rem; }
@keyframes fd1 { 0%,100%{transform:translateY(0) rotate(0deg) scale(1)} 50%{transform:translateY(-20px) rotate(10deg) scale(1.1)} }
@keyframes fd2 { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-15px) rotate(-8deg) scale(1.05)} }
@keyframes fd3 { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-18px) rotate(6deg) scale(1.08)} }

.login-3d-card {
  background: linear-gradient(145deg, #1a1a1a, #111);
  border-radius: 24px;
  padding: 2.5rem;
  width: 100%;
  max-width: 420px;
  position: relative;
  z-index: 1;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow: 0 0 0 1px rgba(45,106,79,0.3), 0 20px 60px rgba(0,0,0,0.8), 0 0 80px rgba(45,106,79,0.15), inset 0 1px 0 rgba(255,255,255,0.05);
}
.card-top-line {
  position: absolute; top:0; left:50%; transform:translateX(-50%);
  width:60%; height:1px;
  background: linear-gradient(90deg, transparent, rgba(82,183,136,0.8), transparent);
}
.card-bottom-line {
  position: absolute; bottom:0; left:50%; transform:translateX(-50%);
  width:40%; height:1px;
  background: linear-gradient(90deg, transparent, rgba(82,183,136,0.5), transparent);
}
.login-3d-header { text-align:center; margin-bottom:1.75rem; }
.login-3d-icon {
  width:70px; height:70px;
  background: linear-gradient(135deg, #2D6A4F, #52B788);
  border-radius: 20px;
  display: flex; align-items:center; justify-content:center;
  margin: 0 auto 1rem;
  font-size: 2rem;
  box-shadow: 0 10px 30px rgba(45,106,79,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
  transform: rotate(-5deg);
}
.login-3d-header h1 { font-family:'Syne',sans-serif; font-size:1.6rem; font-weight:800; color:#fff; margin:0 0 0.3rem; letter-spacing:-0.03em; }
.login-3d-header p { color:#666; font-size:0.88rem; margin:0; }

.google-3d-btn {
  display: flex; align-items:center; justify-content:center; gap:0.75rem;
  width:100%; padding:0.85rem;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.1);
  background:rgba(255,255,255,0.05);
  color:#fff; font-weight:600; font-size:0.9rem;
  cursor:pointer; text-decoration:none;
  margin-bottom:1.25rem;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.05);
  transition: all 0.2s;
}
.google-3d-btn:hover { background:rgba(255,255,255,0.08); border-color:rgba(82,183,136,0.4); }

.divider-3d { display:flex; align-items:center; gap:1rem; margin-bottom:1.25rem; }
.divider-3d::before, .divider-3d::after { content:''; flex:1; height:1px; background:rgba(255,255,255,0.08); }
.divider-3d span { color:#444; font-size:0.8rem; }

.form-group-3d { margin-bottom:1rem; }
.form-group-3d label { display:block; font-size:0.72rem; font-weight:700; color:#555; margin-bottom:0.4rem; text-transform:uppercase; letter-spacing:0.08em; }
.form-group-3d input {
  width:100%; padding:0.85rem 1rem;
  border:1px solid rgba(255,255,255,0.08);
  border-radius:12px; font-size:0.92rem;
  background:rgba(255,255,255,0.04);
  color:#fff; box-sizing:border-box; outline:none;
  box-shadow:inset 0 2px 8px rgba(0,0,0,0.3);
  transition: border 0.2s;
  font-family:'Inter',sans-serif;
}
.form-group-3d input:focus { border-color:rgba(82,183,136,0.5); box-shadow:inset 0 2px 8px rgba(0,0,0,0.3), 0 0 0 3px rgba(82,183,136,0.1); }
.form-group-3d input::placeholder { color:#444; }

.login-3d-btn {
  width:100%; margin-top:0.5rem;
  background: linear-gradient(135deg, #2D6A4F, #52B788);
  color:white; padding:0.95rem;
  border-radius:12px; font-size:1rem; font-weight:700;
  border:none; cursor:pointer;
  box-shadow: 0 8px 30px rgba(45,106,79,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
  transition: all 0.2s;
  letter-spacing:-0.01em;
}
.login-3d-btn:hover { transform:translateY(-2px); box-shadow:0 12px 40px rgba(45,106,79,0.6); }

.auth-switch-3d { text-align:center; margin-top:0.75rem; font-size:0.84rem; color:#555; }
.auth-switch-3d a { color:#52B788; font-weight:600; text-decoration:none; }
.auth-switch-3d a:hover { color:#74C69D; }
</style>
{% endblock %}
